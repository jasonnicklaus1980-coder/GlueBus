# Builds the SP1200 MPC plugin (SP1200-MPC/), runs the offline host test and publishes the install zip as a release.
name: sp1200

on:
  push:
  workflow_dispatch:

permissions:
  contents: write     # needed to publish the release

jobs:
  build:
    # 22.04 on purpose: its armhf glibc keeps the plugin within GLIBC_2.34, like the JV-880 and GlueBus packages
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: SP1200-MPC
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file zip
          pip install --quiet pillow

      - name: Offline host test (x86)
        run: make test

      - name: Build ARM plugin + package (verifies ARM/32-bit/hard-float/glibc)
        run: |
          chmod +x scripts/*.sh mpc/*.sh
          READELF=arm-linux-gnueabihf-readelf ./scripts/package.sh
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SP1200-mpc-armv7
          path: SP1200-MPC/dist/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sp1200-build-${{ github.run_number }}
          name: SP1200 1.0.1 (build ${{ github.run_number }})
          make_latest: false    # "latest" stays the GlueBus release
          files: SP1200-MPC/dist/SP1200-1.0.1-mpc-armv7.zip
          body: |
            Install from Terminus (SSH into the MPC as root):
            1. Upload SP1200-1.0.1-mpc-armv7.zip to /tmp
            2. cd /tmp && unzip -o SP1200-1.0.1-mpc-armv7.zip && sh SP1200-1.0.1/install.sh
