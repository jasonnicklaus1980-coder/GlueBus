# Builds The Remixer for the MPC, runs the offline host test and uploads the install zip as a build artifact.
# It does not publish a release: that needs an explicit go-ahead.
name: theremixer

on:
  push:
    paths:
      - 'TheRemixer-MPC/**'
      - '.github/workflows/theremixer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 22.04 on purpose: its armhf glibc keeps the plugin within GLIBC_2.34, like the JV-880, GlueBus and SP1200 packages
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: TheRemixer-MPC
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file zip
          pip install --quiet pillow

      - name: Skin structure check
        run: python3 skin_tools/test_skin.py

      - name: Offline host test (x86)
        run: make test

      - name: Build ARM plugin and package (verifies ARM, 32-bit, hard-float, glibc)
        run: |
          chmod +x scripts/*.sh mpc/*.sh
          READELF=arm-linux-gnueabihf-readelf ./scripts/package.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheRemixer-0.1.0-mpc-armv7
          path: TheRemixer-MPC/dist/*.zip
