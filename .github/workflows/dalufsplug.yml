# Builds the Da Lufs Plug MPC plugin, runs the offline host test and publishes the install zip as a release.
# Works whether the repo holds the DaLufsPlug-MPC/ folder or just DaLufsPlug-MPC-source.zip (phone-friendly upload).
name: dalufsplug

on:
  push:
  workflow_dispatch:

permissions:
  contents: write     # needed to publish the release

jobs:
  build:
    # 22.04 on purpose: its armhf glibc keeps the plugin within GLIBC_2.34, like the JV-880, GlueBus and SP1200 packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unpack the source zip if that's what was uploaded)
        run: |
          if [ -f DaLufsPlug-MPC/Makefile ]; then echo "PROJ=DaLufsPlug-MPC" >> "$GITHUB_ENV"
          elif [ -f DaLufsPlug-MPC-source.zip ]; then
            unzip -q -o DaLufsPlug-MPC-source.zip -d dlp_src
            echo "PROJ=dlp_src/DaLufsPlug-MPC" >> "$GITHUB_ENV"
          else echo "Can't find DaLufsPlug-MPC/ or DaLufsPlug-MPC-source.zip"; exit 1; fi

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file zip
          pip install --quiet pillow

      - name: Offline host test (x86)
        working-directory: ${{ env.PROJ }}
        run: make test

      - name: Build ARM plugin + package (verifies ARM/32-bit/hard-float/glibc)
        working-directory: ${{ env.PROJ }}
        run: |
          chmod +x scripts/*.sh mpc/*.sh
          READELF=arm-linux-gnueabihf-readelf ./scripts/package.sh
          mkdir -p "$GITHUB_WORKSPACE/out" && cp dist/DaLufsPlug-1.0.3-mpc-armv7.zip "$GITHUB_WORKSPACE/out/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaLufsPlug-mpc-armv7
          path: out/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dalufsplug-build-${{ github.run_number }}
          name: Da Lufs Plug 1.0.3 (build ${{ github.run_number }})
          make_latest: false
          files: out/DaLufsPlug-1.0.3-mpc-armv7.zip
          body: |
            Install from Terminus (SSH into the MPC as root):
            1. Upload DaLufsPlug-1.0.3-mpc-armv7.zip to /tmp
            2. cd /tmp && unzip -o DaLufsPlug-1.0.3-mpc-armv7.zip && sh DaLufsPlug-1.0.3/install.sh
